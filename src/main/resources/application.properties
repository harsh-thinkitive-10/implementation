spring.application.name=implementation
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ===================================================================
# 1. DATABASE CONNECTION (MYSQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/implementation
spring.datasource.username=root
spring.datasource.password=admin@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 2. JPA & HIBERNATE SETTINGS
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Schema management strategy
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate

# ===================================================================
# 3. SQL LOGGING
# ===================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 4. Liquibase
# ===================================================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# ===============================
# Spring Security - Keycloak
# ===============================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/implementation


# ===============================
# Keycloak
# ===============================

keycloak.server-url=http://localhost:8081
keycloak.realm=implementation


# ===============================
# Keycloak Admin Client
# Used by Spring Boot to create users,
# set passwords and assign roles
# ===============================

keycloak.admin-client-id=implementation-admin
keycloak.admin-client-secret=3PZBvpjSAS1BY6tk2RQUdbWMPts7kdiRjqFKKJD2d04AjSZQyszIzYoF1DO83PnzVjtBiIPQqreLpox8bLhXdO


# ===============================
# Keycloak Login Client
# Used for username/password login
# ===============================

keycloak.login-client-id=implementation-app
