databaseChangeLog:
  - changeSet:
      id: 009-create-password-reset-token
      author: harsh

      changes:
        - createTable:
            tableName: password_reset_token
            columns:

              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: keycloak_user_id
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: used_at
                  type: timestamp

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

        - createIndex:
            tableName: password_reset_token
            indexName: idx_password_reset_token_user
            columns:
              - column:
                  name: keycloak_user_id